<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Night Scores</title>
<meta name="theme-color" content="#1D2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scores">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --ink: #1D2440;
  --ink-soft: #5A6180;
  --bg: #EEF0F5;
  --surface: #FFFFFF;
  --line: #DADDE7;
  --gold: #F2B33D;
  --gold-ink: #6B4A00;
  --danger: #C2412F;
  --nav-bg: #1D2440;
  --nav-ink: #C9CDE0;
  --nav-active: #F2B33D;
  --radius-lg: 18px;
  --radius-sm: 10px;
  color-scheme: light;
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #E8EAF3;
    --ink-soft: #9AA0BC;
    --bg: #12162A;
    --surface: #1C2140;
    --line: #2E3458;
    --gold-ink: #F2B33D;
    --nav-bg: #0C0F1F;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  font-size: 16px;
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- Layout ---------- */
.app { display: flex; flex-direction: column; min-height: 100%; }
header.top {
  background: var(--nav-bg);
  color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 16px;
}
header.top h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
main {
  flex: 1;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 100px);
}
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; background: var(--nav-bg);
  padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px);
  z-index: 20;
}
nav.tabs button {
  flex: 1; background: none; border: 0; color: var(--nav-ink);
  padding: 8px 4px; font-size: 0.8rem; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border-radius: var(--radius-sm);
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--nav-active); }

@media (min-width: 900px) {
  .app { flex-direction: row; }
  header.top { display: none; }
  nav.tabs {
    position: sticky; top: 0; height: 100vh; width: 220px; flex: none;
    flex-direction: column; justify-content: flex-start; gap: 4px;
    padding: 28px 14px;
  }
  nav.tabs::before {
    content: "Game Night Scores"; color: #fff; font-weight: 800; font-size: 1.2rem;
    padding: 0 10px 22px;
  }
  nav.tabs button {
    flex: none; flex-direction: row; justify-content: flex-start; gap: 12px;
    font-size: 1rem; padding: 12px; text-align: left;
  }
  nav.tabs button[aria-current="page"] { background: rgba(255,255,255,0.07); }
  main { padding: 36px 40px 60px; }
}

/* ---------- Common ---------- */
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.view-head h2 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
.btn {
  border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 700;
  background: var(--gold); color: #1D2440;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid currentColor; }
.btn.small { padding: 7px 12px; font-size: 0.9rem; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label, .field .label { font-weight: 700; font-size: 0.9rem; color: var(--ink-soft); }
input[type=text], input[type=date], select, textarea, input[type=search] {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--line); background: var(--surface);
  font-size: 16px; /* prevents iOS zoom */
}
textarea { min-height: 70px; resize: vertical; }
.empty {
  text-align: center; padding: 48px 20px; color: var(--ink-soft);
  border: 2px dashed var(--line); border-radius: var(--radius-lg);
}
.empty p { margin: 0 0 16px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.muted { color: var(--ink-soft); }

/* ---------- Sessions ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.filters select { flex: 1 1 150px; max-width: 260px; }
.month { font-weight: 700; color: var(--ink-soft); margin: 26px 0 10px; font-size: 0.95rem; }
.month:first-child { margin-top: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1200px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.card {
  background: var(--surface); border-radius: var(--radius-lg); padding: 16px 16px 14px;
  border: 1px solid var(--line); text-align: left; width: 100%;
  display: flex; flex-direction: column; gap: 10px;
}
.card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .title { font-weight: 800; font-size: 1.15rem; }
.card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-top: -6px; }
.card .meta { color: var(--ink-soft); font-size: 0.85rem; white-space: nowrap; }
.winner {
  display: flex; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--gold) 18%, transparent);
  border-radius: var(--radius-sm); padding: 8px 12px;
}
.winner .crown { width: 22px; height: 22px; color: var(--gold); flex: none; }
.winner .name { font-weight: 800; flex: 1; color: var(--gold-ink); }
.winner.lost { background: color-mix(in srgb, var(--ink-soft) 14%, transparent); }
.winner.lost .name { color: var(--ink-soft); }
.winner .score { font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--gold-ink); }
.others { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.92rem; }
.others span { display: inline-flex; align-items: center; gap: 6px; }
.others b { font-variant-numeric: tabular-nums; }
.card .tag { align-self: flex-start; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

.fab {
  position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 25;
  box-shadow: 0 6px 18px rgba(29,36,64,0.3); padding: 15px 22px; font-size: 1rem;
}
@media (min-width: 900px) { .fab { display: none; } }
.desk-only { display: none; }
@media (min-width: 900px) { .desk-only { display: inline-block; } }

/* ---------- Players ---------- */
.add-row { display: flex; gap: 10px; margin-bottom: 18px; max-width: 520px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; max-width: 720px; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-weight: 700; }
.list-item .sub { font-size: 0.85rem; color: var(--ink-soft); }
.icon-btn { background: none; border: 0; padding: 8px; border-radius: var(--radius-sm); color: var(--ink-soft); }
.icon-btn svg { width: 20px; height: 20px; display: block; }

/* ---------- Stats ---------- */
.stats-wrap { display: grid; gap: 28px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .stats-wrap { grid-template-columns: 1fr 1fr; } }
.stats-wrap section { min-width: 0; }
.stats-wrap h3 { margin: 0 0 10px; font-size: 1.1rem; }
.note { margin: -4px 0 10px; color: var(--ink-soft); font-size: 0.85rem; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
th, td { padding: 11px 14px; text-align: left; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: 0; font-size: 0.85rem; color: var(--ink-soft); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }
.data-box { max-width: 720px; margin-top: 32px; }
.data-box p { color: var(--ink-soft); margin: 0 0 12px; }
.data-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Session editor ---------- */
dialog {
  border: 0; padding: 0; background: var(--surface); color: var(--ink);
  width: 100%; max-width: 560px; max-height: 100%;
  border-radius: var(--radius-lg);
}
dialog::backdrop { background: rgba(12,15,31,0.55); }
@media (max-width: 600px) {
  dialog { margin: 0; max-width: none; height: 100%; max-height: none; border-radius: 0; }
}
.sheet { display: flex; flex-direction: column; height: 100%; max-height: 92vh; }
@media (max-width: 600px) { .sheet { max-height: none; } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; border-bottom: 1px solid var(--line);
}
.sheet-head h2 { margin: 0; font-size: 1.15rem; }
.sheet-body { padding: 18px 16px; overflow-y: auto; flex: 1; }
.sheet-foot {
  display: flex; gap: 10px; justify-content: space-between;
  padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--line);
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: transparent; border-radius: 999px;
  padding: 8px 14px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
}
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 16px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); }
.score-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.score-row:first-child { border-top: 0; }
.score-row .pname { flex: 1; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.score-row input[data-score] {
  width: 96px; text-align: right; padding: 10px 12px; font-size: 1.2rem; font-weight: 700;
  border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--bg);
  font-variant-numeric: tabular-nums;
}
.score-row .faction { flex-basis: 100%; padding: 8px 12px; background: var(--bg); }
.score-row .sign { width: 40px; height: 44px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: transparent; font-weight: 800; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills span { font-size: 0.85rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.exp-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.exp-row .used { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
.inline-add { display: flex; gap: 8px; margin-top: 10px; }
.error { color: var(--danger); font-weight: 600; margin: 0 0 12px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px;
  font-weight: 600; z-index: 100; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
@media (min-width: 900px) { .toast { bottom: 30px; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
/* ---------- Sign-in ---------- */
.auth {
  min-height: 100%; display: flex; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: var(--nav-bg);
}
.auth-card { background: var(--surface); border-radius: var(--radius-lg); padding: 28px 24px; width: 100%; max-width: 400px; }
.auth-logo { width: 56px; height: 56px; border-radius: 14px; display: block; margin-bottom: 16px; }
.auth h1 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
.auth .lede { margin: 0 0 22px; color: var(--ink-soft); }
.auth input[type=email], .auth input[type=password] {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--line); background: var(--bg); font-size: 16px;
}
.auth-actions { display: flex; gap: 10px; margin-top: 6px; }
.auth-actions .btn { flex: 1; }
.linkish { background: none; border: 0; padding: 0; margin-top: 16px; color: var(--ink-soft); text-decoration: underline; font-size: 0.92rem; }
#auth-msg.ok { color: var(--ink); }
.btn:disabled { opacity: 0.6; }

</style>
</head>
<body>
<div class="auth" id="auth-screen" hidden>
  <div class="auth-card">
    <img class="auth-logo" src="icon-192.png" alt="">
    <h1>Game Night Scores</h1>
    <p class="lede">Sign in to see your scores on every device.</p>
    <div id="auth-setup" hidden>
      <p class="error">Firebase isn’t set up yet. Paste your project’s config into firebase-config.js and upload it again.</p>
    </div>
    <form id="auth-form">
      <p class="error" id="auth-msg" hidden></p>
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="auth-pass">Password</label>
        <input type="password" id="auth-pass" autocomplete="current-password" minlength="6" required>
      </div>
      <div class="auth-actions">
        <button class="btn" type="submit">Sign in</button>
        <button class="btn ghost" type="button" id="auth-signup">Create account</button>
      </div>
      <button class="linkish" type="button" id="auth-reset">Forgot password?</button>
    </form>
  </div>
</div>

<div class="app" hidden>
  <header class="top"><h1>Game Night Scores</h1></header>

  <nav class="tabs" aria-label="Sections">
    <button data-view="sessions" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      Sessions
    </button>
    <button data-view="games">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>
      Games
    </button>
    <button data-view="players">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>
      Players
    </button>
    <button data-view="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Stats
    </button>
  </nav>

  <main id="main"></main>
</div>

<button class="btn fab" id="fab" hidden>New session</button>

<dialog id="editor" aria-labelledby="editor-title">
  <form class="sheet" method="dialog" id="editor-form">
    <div class="sheet-head">
      <h2 id="editor-title">New session</h2>
      <button type="button" class="btn ghost small" id="editor-cancel">Cancel</button>
    </div>
    <div class="sheet-body">
      <p class="error" id="editor-error" hidden></p>
      <div class="two">
        <div class="field">
          <label for="f-game">Game</label>
          <input type="text" id="f-game" list="game-names" autocomplete="off" placeholder="e.g. Catan">
          <datalist id="game-names"></datalist>
        </div>
        <div class="field">
          <label for="f-date">Date</label>
          <input type="date" id="f-date">
        </div>
      </div>
      <label class="toggle"><input type="checkbox" id="f-coop"> Co-op game</label>
      <label class="toggle" id="f-low-wrap"><input type="checkbox" id="f-low"> Lowest score wins</label>

      <div class="field" id="exp-field" hidden>
        <span class="label">Expansions used</span>
        <div class="chips" id="f-exps"></div>
        <div class="inline-add">
          <input type="text" id="f-newexp" placeholder="Add a new expansion" autocomplete="off">
          <button type="button" class="btn ghost small" id="f-addexp">Add</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Who played?</span>
        <div class="chips" id="f-players"></div>
        <div class="inline-add">
          <input type="text" id="f-newplayer" placeholder="Add a new player" autocomplete="off">
          <button type="button" class="btn ghost small" id="f-addplayer">Add</button>
        </div>
      </div>

      <div class="field" id="coop-field" hidden>
        <span class="label">Result</span>
        <div class="chips" id="f-result">
          <button type="button" class="chip" data-won="true">We won</button>
          <button type="button" class="chip" data-won="false">We lost</button>
        </div>
      </div>

      <div class="field" id="scores-field" hidden>
        <span class="label" id="scores-label">Final scores</span>
        <div id="f-scores"></div>
        <datalist id="faction-names"></datalist>
      </div>

      <div class="field" id="first-field" hidden>
        <label for="f-first">Who went first? (optional)</label>
        <select id="f-first"></select>
      </div>

      <div class="field">
        <label for="f-notes">Notes (optional)</label>
        <textarea id="f-notes" placeholder="House rules, who brought snacks…"></textarea>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn danger" id="editor-delete" hidden>Delete</button>
      <span></span>
      <button type="submit" class="btn" id="editor-save">Save session</button>
    </div>
  </form>
</dialog>

<dialog id="game-editor" aria-labelledby="game-title">
  <form class="sheet" id="game-form">
    <div class="sheet-head">
      <h2 id="game-title">New game</h2>
      <button type="button" class="btn ghost small" id="game-cancel">Cancel</button>
    </div>
    <div class="sheet-body">
      <p class="error" id="game-error" hidden></p>
      <div class="field">
        <label for="g-name">Name</label>
        <input type="text" id="g-name" autocomplete="off" placeholder="e.g. Catan">
      </div>
      <div class="three">
        <div class="field">
          <label for="g-min">Min players</label>
          <input type="text" inputmode="numeric" id="g-min" autocomplete="off">
        </div>
        <div class="field">
          <label for="g-max">Max players</label>
          <input type="text" inputmode="numeric" id="g-max" autocomplete="off">
        </div>
        <div class="field">
          <label for="g-time">Minutes</label>
          <input type="text" inputmode="numeric" id="g-time" autocomplete="off">
        </div>
      </div>
      <label class="toggle"><input type="checkbox" id="g-coop"> Co-op: everyone wins or loses together</label>
      <label class="toggle" id="g-low-wrap"><input type="checkbox" id="g-low"> Lowest score wins</label>
      <label class="toggle"><input type="checkbox" id="g-factions"> Track factions or characters</label>
      <div class="field">
        <span class="label">Expansions</span>
        <div id="g-exps"></div>
        <div class="inline-add">
          <input type="text" id="g-newexp" placeholder="Add an expansion" autocomplete="off">
          <button type="button" class="btn ghost small" id="g-addexp">Add</button>
        </div>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn danger" id="game-delete" hidden>Delete</button>
      <span></span>
      <button type="submit" class="btn">Save game</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, signOut
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

/* =========================================================
   Firebase setup
   ========================================================= */
const configured = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith('PASTE');
let auth, fs;
if (configured) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  // Offline cache: the app works without signal and syncs when back online.
  fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
}

const COLORS = ['#E4572E', '#2E86AB', '#F2B33D', '#4CAF7A', '#9B5DE5', '#F15BB5', '#00A6A6', '#8D6E63', '#5C6BC0', '#C0CA33'];

let user = null;
let db = { players: [], games: [], sessions: [] };
let loaded = { players: false, games: false, sessions: false };
const ready = () => Object.values(loaded).every(Boolean);
let pendingSync = false;
let unsubs = [];

const playersCol = () => collection(fs, 'users', user.uid, 'players');
const gamesCol = () => collection(fs, 'users', user.uid, 'games');
const sessionsCol = () => collection(fs, 'users', user.uid, 'sessions');
const newId = () => doc(playersCol()).id;

// Writes apply locally straight away; the promise only settles once the server confirms,
// which can be much later when offline, so we never wait on it.
const write = p => p.catch(err => { console.error(err); toast('Couldn’t save to your account. Check you’re signed in.'); });

function startSync() {
  stopSync();
  loaded = { players: false, games: false, sessions: false };
  unsubs.push(onSnapshot(playersCol(), snap => {
    db.players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded.players = true; afterSnapshot();
  }, onSyncError));
  unsubs.push(onSnapshot(gamesCol(), snap => {
    db.games = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded.games = true; afterSnapshot();
  }, onSyncError));
  unsubs.push(onSnapshot(sessionsCol(), { includeMetadataChanges: true }, snap => {
    db.sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    pendingSync = snap.metadata.hasPendingWrites;
    loaded.sessions = true; afterSnapshot();
  }, onSyncError));
}
function stopSync() { unsubs.forEach(u => u()); unsubs = []; }
function onSyncError(err) {
  console.error(err);
  toast(err.code === 'permission-denied' ? 'Database rules are blocking access. Check the Firestore rules.' : 'Sync problem. Your changes are kept on this device.');
}

function afterSnapshot() {
  if (!dlg.open && !gameDlg.open) render();
}

/* =========================================================
   Data helpers
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const playerById = id => db.players.find(p => p.id === id);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function addPlayer(name) {
  name = name.trim();
  if (!name) return null;
  const existing = db.players.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const p = { id: newId(), name, color: COLORS[db.players.length % COLORS.length] };
  db.players.push(p); // show immediately; the live listener will confirm it
  write(setDoc(doc(playersCol(), p.id), { name: p.name, color: p.color }));
  return p;
}

const gameById = id => db.games.find(g => g.id === id);
const gameByName = name => db.games.find(g => g.name.toLowerCase() === name.trim().toLowerCase());
const gameNameOf = s => gameById(s.gameId)?.name || 'Unknown game';
const sessionsOfGame = id => db.sessions.filter(s => s.gameId === id);
function expansionNames(s) {
  const exps = gameById(s.gameId)?.expansions || [];
  return s.expansionIds.map(id => exps.find(x => x.id === id)?.name).filter(Boolean);
}

function addGame(name, props = {}) {
  name = name.trim();
  if (!name) return null;
  const existing = gameByName(name);
  if (existing) return existing;
  const g = { id: newId(), name, lowWins: false, coop: false, factions: false, expansions: [], ...props };
  db.games.push(g);
  write(setDoc(doc(gamesCol(), g.id), stripId(g)));
  return g;
}
function addExpansion(g, name) {
  name = name.trim();
  if (!name) return null;
  const existing = g.expansions.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const x = { id: newId(), name };
  g.expansions.push(x);
  write(setDoc(doc(gamesCol(), g.id), { expansions: g.expansions }, { merge: true }));
  return x;
}

function winnersOf(s) {
  if (s.coop || !s.results?.length) return [];
  const scores = s.results.map(r => r.score);
  const best = s.lowWins ? Math.min(...scores) : Math.max(...scores);
  return s.results.filter(r => r.score === best).map(r => r.playerId);
}
function sortedResults(s) {
  return [...(s.results || [])].sort((a, b) => s.lowWins ? a.score - b.score : b.score - a.score);
}
const lastPlayed = g => sessionsOfGame(g.id).reduce((last, s) => s.date > last ? s.date : last, '');
const shortDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const pct = x => `${Math.round(x * 100)}%`;
function playedGames() {
  return db.games.filter(g => sessionsOfGame(g.id).length).sort((a, b) => a.name.localeCompare(b.name));
}

// Firestore batches hold up to 500 writes; chunk to be safe.
async function runBatched(ops) {
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(fs);
    ops.slice(i, i + 400).forEach(op => op(b));
    write(b.commit());
  }
}
const stripId = ({ id, ...rest }) => rest;

function mergeIn(data) {
  const ops = [];
  data.players.forEach(p => ops.push(b => b.set(doc(playersCol(), p.id), stripId(p), { merge: true })));
  data.games.forEach(g => ops.push(b => b.set(doc(gamesCol(), g.id), stripId(g), { merge: true })));
  data.sessions.forEach(s => ops.push(b => b.set(doc(sessionsCol(), s.id), stripId(s), { merge: true })));
  runBatched(ops);
}
function replaceWith(data) {
  const ops = [];
  db.players.forEach(p => ops.push(b => b.delete(doc(playersCol(), p.id))));
  db.games.forEach(g => ops.push(b => b.delete(doc(gamesCol(), g.id))));
  db.sessions.forEach(s => ops.push(b => b.delete(doc(sessionsCol(), s.id))));
  runBatched(ops);
  mergeIn(data);
}

function authError(code) {

let currentView = 'sessions';
let gameFilter = '';
let pickPlayers = '', pickTime = '', gameSort = 'name';
const main = document.getElementById('main');

document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));
function show(view) {
  currentView = view;

function render() {

const crownSVG = '<svg class="crown" viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z"/></svg>';
const editSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const trashSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

/* =========================================================
   Sessions view
   ========================================================= */
function renderSessions() {
  const games = playedGames();
  if (gameFilter && !games.some(g => g.id === gameFilter)) gameFilter = '';
  const list = db.sessions
    .filter(s => !gameFilter || s.gameId === gameFilter)
    .sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));

  let html = `<div class="view-head"><h2>Sessions</h2>
    <button class="btn desk-only" data-action="new">New session</button></div>`;

  if (!db.sessions.length) {
    html += `<div class="empty"><p>No sessions yet. Log your first game night’s final scores.</p>
      <button class="btn" data-action="new">New session</button></div>`;
    main.innerHTML = html; return;
  }

  html += `<div class="filters"><select id="game-filter" aria-label="Filter by game">
    <option value="">All games (${db.sessions.length})</option>
    ${games.map(g => `<option value="${g.id}" ${g.id === gameFilter ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
  </select></div>`;

  let lastMonth = '', open = false;
  list.forEach(s => {
    const d = new Date(s.date + 'T00:00:00');
    const month = d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    if (month !== lastMonth) {
      if (open) html += '</div>';
      html += `<div class="month">${esc(month)}</div><div class="grid">`;
      open = true; lastMonth = month;
    }
    const exps = expansionNames(s);
    html += `<button class="card" data-edit="${s.id}">
      <div class="row1"><span class="title">${esc(gameNameOf(s))}</span>
        <span class="meta">${d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })}</span></div>
      ${exps.length ? `<div class="sub">+ ${esc(exps.join(', '))}</div>` : ''}
      ${s.coop ? coopResult(s) : competitiveResult(s)}
      ${s.lowWins ? '<span class="tag">Lowest wins</span>' : ''}
    </button>`;
  });
  if (open) html += '</div>';
  main.innerHTML = html;
  document.getElementById('game-filter').addEventListener('change', e => { gameFilter = e.target.value; renderSessions(); });
}

function playerLabel(r) {
  return esc(playerById(r.playerId)?.name || 'Unknown') + (r.faction ? ` <small class="muted">(${esc(r.faction)})</small>` : '');
}
function playerTag(r) {
  return `<span><i class="dot" style="background:${playerById(r.playerId)?.color || '#999'}"></i>${playerLabel(r)}${'score' in r ? ` <b>${r.score}</b>` : ''}</span>`;
}
function competitiveResult(s) {
  const wins = winnersOf(s);
  const res = sortedResults(s);
  const others = res.filter(r => !wins.includes(r.playerId));
  return `<div class="winner">${crownSVG}<span class="name">${res.filter(r => wins.includes(r.playerId)).map(playerLabel).join(' & ')}${wins.length > 1 ? ' (tie)' : ''}</span><span class="score">${esc(res[0]?.score ?? '')}</span></div>
    ${others.length ? `<div class="others">${others.map(playerTag).join('')}</div>` : ''}`;
}
function coopResult(s) {
  return `<div class="winner${s.won ? '' : ' lost'}">${s.won ? crownSVG : ''}<span class="name">${s.won ? 'Won together' : 'Lost together'}</span></div>
    <div class="others">${s.results.map(playerTag).join('')}</div>`;
}

main.addEventListener('click', e => {

});

   Games view
   ========================================================= */
function renderGames() {
  let html = `<div class="view-head"><h2>Games</h2>
    <button class="btn" data-action="new-game">New game</button></div>`;
  if (!db.games.length) {
    main.innerHTML = html + `<div class="empty"><p>Add the games you own and their expansions. Games you type in a new session are added here too.</p></div>`;
    return;
  }
  const option = (value, label, current) => `<option value="${value}"${String(value) === current ? ' selected' : ''}>${label}</option>`;
  html += `<div class="filters">
    <select id="pick-players" aria-label="Number of players">${option('', 'Any players', pickPlayers)}${[1, 2, 3, 4, 5, 6, 7, 8].map(n => option(n, `${n} player${n > 1 ? 's' : ''}`, pickPlayers)).join('')}</select>
    <select id="pick-time" aria-label="Time available">${option('', 'Any length', pickTime)}${[30, 45, 60, 90, 120, 180].map(m => option(m, `Up to ${m} min`, pickTime)).join('')}</select>
    <select id="game-sort" aria-label="Sort games">${option('name', 'A to Z', gameSort)}${option('stale', 'Least recently played', gameSort)}</select>
  </div>`;
  const n = Number(pickPlayers), t = Number(pickTime);
  const list = db.games
    .filter(g => !n || (g.minPlayers <= n && n <= g.maxPlayers))
    .filter(g => !t || (g.playTime && g.playTime <= t))
    .map(g => ({ g, last: lastPlayed(g), played: sessionsOfGame(g.id).length }))
    .sort((a, b) => (gameSort === 'stale' && a.last.localeCompare(b.last)) || a.g.name.localeCompare(b.g.name));
  html += list.length ? `<div class="grid">${list.map(({ g, last, played }) => {
    const players = g.minPlayers && (g.minPlayers === g.maxPlayers ? g.minPlayers : `${g.minPlayers}–${g.maxPlayers}`);
    const info = [players && `${players} player${g.maxPlayers > 1 ? 's' : ''}`, g.playTime && `${g.playTime} min`, last && `last played ${shortDate(last)}`].filter(Boolean).join(' · ');
    const tags = [g.coop && 'Co-op', g.lowWins && 'Lowest wins', g.factions && 'Factions'].filter(Boolean);
    return `<button class="card" data-game="${g.id}">
      <div class="row1"><span class="title">${esc(g.name)}</span><span class="meta">${played ? `${played} played` : 'Never played'}</span></div>
      ${info ? `<div class="sub">${info}</div>` : ''}
      ${g.expansions.length ? `<div class="pills">${g.expansions.map(x => `<span>${esc(x.name)}</span>`).join('')}</div>` : ''}
      ${tags.length ? `<div class="tags">${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>` : ''}
    </button>`;
  }).join('')}</div>`
    : `<div class="empty"><p>No games match. Add player counts and play times to your games to use these filters.</p></div>`;
  main.innerHTML = html;
  [['pick-players', v => pickPlayers = v], ['pick-time', v => pickTime = v], ['game-sort', v => gameSort = v]].forEach(([id, set]) =>
    document.getElementById(id).addEventListener('change', e => { set(e.target.value); renderGames(); }));
}

   Players view

function renderPlayers() {
  let html = `<div class="view-head"><h2>Players</h2></div>
    <form class="add-row" id="add-player-form">
      <input type="text" id="new-player" placeholder="Player name" autocomplete="off" aria-label="Player name">
      <button class="btn" type="submit">Add player</button>
    </form>`;
  if (!db.players.length) {
    html += `<div class="empty"><p>Add the people you play with. You can also add players while logging a session.</p></div>`;
  } else {
    const sorted = [...db.players].sort((a, b) => a.name.localeCompare(b.name));
    html += `<div class="list">${sorted.map(p => {
      const played = db.sessions.filter(s => s.results.some(r => r.playerId === p.id)).length;
      const won = db.sessions.filter(s => winnersOf(s).includes(p.id)).length;
      return `<div class="list-item">
        <i class="dot" style="background:${p.color};width:16px;height:16px"></i>
        <div class="grow"><div class="title">${esc(p.name)}</div>
          <div class="sub">${played} played, ${won} won</div></div>
        <button class="icon-btn" data-action="rename-player" data-id="${p.id}" aria-label="Rename ${esc(p.name)}">${editSVG}</button>
        <button class="icon-btn" data-action="delete-player" data-id="${p.id}" aria-label="Delete ${esc(p.name)}">${trashSVG}</button>
      </div>`;
    }).join('')}</div>`;
  }

  document.getElementById('add-player-form').addEventListener('submit', e => {

    const p = addPlayer(input.value);

    renderPlayers();

}
function renamePlayer(id) {
  const p = playerById(id);
  const name = prompt('Rename player', p.name);
  if (name && name.trim()) {
    p.name = name.trim();
    write(setDoc(doc(playersCol(), id), { name: p.name }, { merge: true }));
    render();
  }
}
function deletePlayer(id) {
  const p = playerById(id);
  const affected = db.sessions.filter(s => s.results.some(r => r.playerId === id));
  const msg = affected.length
    ? `Delete ${p.name}? Their scores will be removed from ${affected.length} session${affected.length > 1 ? 's' : ''}.`
    : `Delete ${p.name}?`;
  if (!confirm(msg)) return;
  const ops = [b => b.delete(doc(playersCol(), id))];
  affected.forEach(s => {
    const results = s.results.filter(r => r.playerId !== id);
    const ref = doc(sessionsCol(), s.id);
    ops.push(results.length ? b => b.set(ref, { results }, { merge: true }) : b => b.delete(ref));
  });
  runBatched(ops);
  toast(`Deleted ${p.name}`);
}

/* =========================================================
   Stats view
   ========================================================= */
const num = label => ({ label, num: true });
function statTable(title, cols, rows, note = '') {
  if (!rows.length) return '';
  const cls = i => cols[i].num ? ' class="num"' : '';
  return `<section><h3>${title}</h3>${note ? `<p class="note">${note}</p>` : ''}<div class="table-scroll"><table>
    <thead><tr>${cols.map((c, i) => `<th${cls(i)}>${c.label ?? c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((cell, i) => `<td${cls(i)}>${cell}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></section>`;
}

function renderStats() {
  let html = `<div class="view-head"><h2>Stats</h2></div>`;
  if (!db.sessions.length) {
    html += `<div class="empty"><p>Stats appear once you’ve logged a session.</p></div>`;
  } else {
    const competitive = db.sessions.filter(s => !s.coop)
      .sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
    const playerCell = p => `<i class="dot" style="background:${p.color};margin-right:8px"></i>${esc(p.name)}`;

    const pRows = db.players.map(p => {
      const mine = competitive.filter(s => s.results.some(r => r.playerId === p.id));
      let won = 0, streak = 0, best = 0;
      mine.forEach(s => {
        if (winnersOf(s).includes(p.id)) { won++; streak++; best = Math.max(best, streak); }
        else streak = 0;
      });
      return { p, played: mine.length, won, streak, best };
    }).filter(r => r.played).sort((a, b) => b.won - a.won || b.won / b.played - a.won / a.played);

    const scoreOf = (s, id) => s.results.find(r => r.playerId === id)?.score;
    const beats = (s, a, b) => {
      const x = scoreOf(s, a), y = scoreOf(s, b);
      return x !== undefined && y !== undefined && x !== y && (s.lowWins ? x < y : x > y);
    };
    const rivals = pRows.map(r => r.p);
    const h2hRows = rivals.length > 1 ? rivals.map(a => [playerCell(a), ...rivals.map(b => {
      if (a === b) return '–';
      const w = competitive.filter(s => beats(s, a.id, b.id)).length;
      const l = competitive.filter(s => beats(s, b.id, a.id)).length;
      return w || l ? `${w}–${l}` : '';
    })]) : [];

    const gRows = playedGames().map(g => {
      const ss = sessionsOfGame(g.id);
      const comp = ss.filter(s => !s.coop), coop = ss.filter(s => s.coop);
      const tally = {};
      comp.forEach(s => winnersOf(s).forEach(id => tally[id] = (tally[id] || 0) + 1));
      const top = Math.max(0, ...Object.values(tally));
      const champs = Object.keys(tally).filter(id => tally[id] === top).map(id => playerById(id)?.name).filter(Boolean);
      const teamWins = coop.filter(s => s.won).length;
      if (coop.length) champs.push(`Team ${teamWins}–${coop.length - teamWins}`);
      const low = comp.some(s => s.lowWins);
      const bestR = comp.flatMap(s => s.results).sort((a, b) => low ? a.score - b.score : b.score - a.score)[0];
      return [esc(g.name), ss.length, esc(champs.join(', ')), bestR ? `${bestR.score} (${esc(playerById(bestR.playerId)?.name || '?')})` : ''];
    }).sort((a, b) => b[1] - a[1]);

    const fTally = {};
    db.sessions.forEach(s => {
      const wins = winnersOf(s);
      s.results.filter(r => r.faction).forEach(r => {
        const t = fTally[`${s.gameId}/${r.faction.toLowerCase()}`] ??= { game: gameNameOf(s), faction: r.faction, played: 0, won: 0 };
        t.played++;
        if (s.coop ? s.won : wins.includes(r.playerId)) t.won++;
      });
    });
    const fRows = Object.values(fTally)
      .sort((a, b) => a.game.localeCompare(b.game) || b.won / b.played - a.won / a.played)
      .map(t => [esc(t.game), esc(t.faction), t.played, t.won, pct(t.won / t.played)]);

    const outcome = list => {
      if (!list.length) return '–';
      if (list.every(s => s.coop)) return `${pct(list.filter(s => s.won).length / list.length)} won`;
      const comp = list.filter(s => !s.coop && s.results.length);
      return comp.length ? `avg ${Math.round(comp.reduce((sum, s) => sum + sortedResults(s)[0].score, 0) / comp.length * 10) / 10}` : '–';
    };
    const xRows = playedGames().flatMap(g => {
      const ss = sessionsOfGame(g.id);
      return g.expansions.map(x => {
        const withX = ss.filter(s => s.expansionIds.includes(x.id));
        return withX.length && [esc(g.name), esc(x.name), withX.length, outcome(withX), outcome(ss.filter(s => !withX.includes(s)))];
      }).filter(Boolean);
    });

    const firsts = competitive.filter(s => s.firstPlayerId && s.results.length > 1 && s.results.some(r => r.playerId === s.firstPlayerId));
    const firstRow = (label, list) => [label, list.length,
      pct(list.filter(s => winnersOf(s).includes(s.firstPlayerId)).length / list.length),
      pct(list.reduce((sum, s) => sum + 1 / s.results.length, 0) / list.length)];
    const firstRows = firsts.length ? [firstRow('All games', firsts), ...playedGames()
      .map(g => [g, firsts.filter(s => s.gameId === g.id)])
      .filter(([, list]) => list.length)
      .map(([g, list]) => firstRow(esc(g.name), list))] : [];

    html += `<div class="stats-wrap">
      ${statTable('Players', ['Player', num('Played'), num('Wins'), num('Win rate'), num('Streak'), num('Best')],
        pRows.map(r => [playerCell(r.p), r.played, r.won, pct(r.won / r.played), r.streak, r.best]),
        'Competitive games only. Streaks count wins in a row, ties included.')}
      ${statTable('Games', ['Game', num('Played'), 'Most wins', 'Best score'], gRows)}
      ${statTable('Head to head', ['', ...rivals.map(p => num(esc(p.name)))], h2hRows,
        'Wins–losses for each row’s player against each column’s player, in games they both played.')}
      ${statTable('Factions and characters', ['Game', 'Faction', num('Played'), num('Wins'), num('Win rate')], fRows)}
      ${statTable('Expansions', ['Game', 'Expansion', num('Played'), num('With'), num('Without')], xRows,
        'Average winning score with and without each expansion, or team win rate for co-op games.')}
      ${statTable('Going first', ['Game', num('Sessions'), num('First player won'), num('Fair share')], firstRows,
        'How often the first player won, against what you’d expect if going first made no difference.')}
    </div>`;
  }
  html += `<section class="data-box"><h3>Account</h3>
    <p>Signed in as <b>${esc(user.email)}</b>. ${pendingSync ? 'Some changes are waiting to sync and will upload when you’re online.' : 'Everything is synced.'}</p>
    <div class="data-actions">
      <button class="btn" data-action="export">Export backup</button>
      <button class="btn ghost" data-action="import">Import backup</button>
      <button class="btn ghost" data-action="signout">Sign out</button>
    </div></section>`;
  main.innerHTML = html;
}

function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'game-night-scores', version: 3, exported: new Date().toISOString(), ...db }, null, 2)], { type: 'application/json' });
  const file = new File([blob], `game-night-scores-${todayISO()}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    navigator.share({ files: [file], title: 'Game night scores backup' }).catch(() => {});
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup exported');
}
document.getElementById('import-file').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let d;
  try {
    d = JSON.parse(await f.text());
    if (![d.players, d.games, d.sessions].every(Array.isArray)) throw new Error('bad file');
  } catch { return toast('That file isn’t a valid backup'); }
  const merge = confirm(`This backup has ${d.players.length} players, ${d.games.length} games and ${d.sessions.length} sessions.\n\nOK = merge with your account\nCancel = choose replace instead`);
  if (merge) mergeIn(d);
  else {
    if (!confirm('Replace everything in your account with the backup? This can’t be undone.')) return;
    replaceWith(d);
  }
  toast('Backup imported');
});

/* =========================================================
   Session editor
   ========================================================= */
const dlg = document.getElementById('editor');
const F = id => document.getElementById(id);
let editing = null;
let selected = [];
let selectedExp = [];
let scoreDraft = {};
let factionDraft = {};
let firstPlayer = '';
let coopWon = true;
const editorGame = () => gameByName(F('f-game').value);

function openEditor(id) {
  editing = id || null;
  const s = id ? db.sessions.find(x => x.id === id) : null;
  F('editor-title').textContent = s ? 'Edit session' : 'New session';
  F('editor-delete').hidden = !s;
  F('editor-error').hidden = true;
  F('f-game').value = s ? gameNameOf(s) : '';
  F('f-date').value = s ? s.date : todayISO();
  F('f-low').checked = !!s?.lowWins;
  F('f-coop').checked = !!s?.coop;
  coopWon = s?.coop ? s.won : true;
  firstPlayer = s?.firstPlayerId || '';
  F('f-notes').value = s ? (s.notes || '') : '';
  F('f-newplayer').value = '';
  F('f-newexp').value = '';
  selectedExp = s ? [...s.expansionIds] : [];
  selected = s ? s.results.map(r => r.playerId).filter(playerById) : [];
  scoreDraft = {};
  factionDraft = {};
  s?.results.forEach(r => {
    if ('score' in r) scoreDraft[r.playerId] = String(r.score);
    if (r.faction) factionDraft[r.playerId] = r.faction;
  });
  F('game-names').innerHTML = [...db.games].sort((a, b) => a.name.localeCompare(b.name)).map(g => `<option value="${esc(g.name)}">`).join('');
  drawExpansionChips(); drawPlayerChips(); drawMode();
  dlg.showModal();
  if (!s) setTimeout(() => F('f-game').focus(), 50);
}
function drawExpansionChips() {
  const name = F('f-game').value.trim();
  F('exp-field').hidden = !name;
  const exps = [...(gameByName(name)?.expansions || [])].sort((a, b) => a.name.localeCompare(b.name));
  F('f-exps').innerHTML = exps.length
    ? exps.map(x => `<button type="button" class="chip" data-xid="${x.id}" aria-pressed="${selectedExp.includes(x.id)}">${esc(x.name)}</button>`).join('')
    : '<span class="muted">No expansions for this game yet.</span>';
}
F('f-exps').addEventListener('click', e => {
  const chip = e.target.closest('[data-xid]');
  if (!chip) return;
  const xid = chip.dataset.xid;
  selectedExp = selectedExp.includes(xid) ? selectedExp.filter(x => x !== xid) : [...selectedExp, xid];
  chip.setAttribute('aria-pressed', selectedExp.includes(xid));
});
function addExpansionFromEditor() {
  const name = F('f-newexp').value;
  if (!name.trim()) return;
  const g = addGame(F('f-game').value, { lowWins: F('f-low').checked, coop: F('f-coop').checked });
  if (!g) return;
  const x = addExpansion(g, name);
  F('f-game').value = g.name;
  if (!selectedExp.includes(x.id)) selectedExp.push(x.id);
  F('f-newexp').value = '';
  drawExpansionChips();
}
F('f-addexp').addEventListener('click', addExpansionFromEditor);
F('f-newexp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addExpansionFromEditor(); } });

function drawPlayerChips() {
  const sorted = [...db.players].sort((a, b) => a.name.localeCompare(b.name));
  F('f-players').innerHTML = sorted.length
    ? sorted.map(p => `<button type="button" class="chip" data-pid="${p.id}" aria-pressed="${selected.includes(p.id)}">
        <i class="dot" style="background:${p.color}"></i>${esc(p.name)}</button>`).join('')
    : '<span class="muted">No players yet. Add one below.</span>';
}
function drawMode() {
  const coop = F('f-coop').checked;
  F('f-low-wrap').hidden = coop;
  F('coop-field').hidden = !coop;
  F('f-result').querySelectorAll('[data-won]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.won === String(coopWon))));
  drawScoreRows();
}
function drawScoreRows() {
  const coop = F('f-coop').checked;
  const g = editorGame();
  const factions = !!g?.factions;
  F('scores-field').hidden = !selected.length || (coop && !factions);
  F('scores-label').textContent = coop ? 'Factions or characters' : 'Final scores';
  F('faction-names').innerHTML = factions
    ? [...new Set(sessionsOfGame(g.id).flatMap(s => s.results.map(r => r.faction)).filter(Boolean))].sort().map(f => `<option value="${esc(f)}">`).join('')
    : '';
  F('f-scores').innerHTML = selected.map(pid => {
    const p = playerById(pid);
    return `<div class="score-row">
      <span class="pname"><i class="dot" style="background:${p.color}"></i>${esc(p.name)}</span>
      ${coop ? '' : `<button type="button" class="sign" data-sign="${pid}" aria-label="Make ${esc(p.name)}’s score negative or positive">±</button>
      <input type="text" inputmode="decimal" data-score="${pid}" value="${esc(scoreDraft[pid] ?? '')}" placeholder="0" aria-label="${esc(p.name)} final score">`}
      ${factions ? `<input type="text" class="faction" data-faction="${pid}" list="faction-names" value="${esc(factionDraft[pid] ?? '')}" placeholder="Faction or character" autocomplete="off" aria-label="${esc(p.name)} faction or character">` : ''}
    </div>`;
  }).join('');
  if (!selected.includes(firstPlayer)) firstPlayer = '';
  F('first-field').hidden = coop || selected.length < 2;
  F('f-first').innerHTML = '<option value="">Not recorded</option>' +
    selected.map(pid => `<option value="${pid}"${pid === firstPlayer ? ' selected' : ''}>${esc(playerById(pid).name)}</option>`).join('');
}
F('f-coop').addEventListener('change', drawMode);
F('f-result').addEventListener('click', e => {
  const b = e.target.closest('[data-won]');
  if (!b) return;
  coopWon = b.dataset.won === 'true';
  drawMode();
});
F('f-first').addEventListener('change', e => { firstPlayer = e.target.value; });
F('f-players').addEventListener('click', e => {
  const chip = e.target.closest('[data-pid]');
  if (!chip) return;
  const pid = chip.dataset.pid;
  selected = selected.includes(pid) ? selected.filter(x => x !== pid) : [...selected, pid];
  chip.setAttribute('aria-pressed', selected.includes(pid));
  drawScoreRows();
});
F('f-scores').addEventListener('input', e => {
  if (e.target.dataset.score) scoreDraft[e.target.dataset.score] = e.target.value;
  if (e.target.dataset.faction) factionDraft[e.target.dataset.faction] = e.target.value;
});
F('f-scores').addEventListener('click', e => {
  const b = e.target.closest('[data-sign]');
  if (!b) return;
  const pid = b.dataset.sign;
  let v = (scoreDraft[pid] || '').trim();
  v = v.startsWith('-') ? v.slice(1) : '-' + v;
  scoreDraft[pid] = v;
  document.querySelector(`[data-score="${pid}"]`).value = v;
});
function addPlayerFromEditor() {
  const name = F('f-newplayer').value;
  if (!name.trim()) return;
  const p = addPlayer(name);
  if (!selected.includes(p.id)) selected.push(p.id);
  F('f-newplayer').value = '';
  drawPlayerChips(); drawScoreRows();
}
F('f-addplayer').addEventListener('click', addPlayerFromEditor);
F('f-newplayer').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlayerFromEditor(); } });
F('f-game').addEventListener('input', () => { drawExpansionChips(); drawScoreRows(); });
F('f-game').addEventListener('change', () => {
  const g = editorGame();
  if (g) {
    F('f-low').checked = g.lowWins;
    F('f-coop').checked = !!g.coop;
  }
  drawMode();
});
F('editor-cancel').addEventListener('click', () => dlg.close());
dlg.addEventListener('close', () => render());

F('editor-form').addEventListener('submit', e => {
  e.preventDefault();
  const err = msg => { F('editor-error').textContent = msg; F('editor-error').hidden = false; F('editor-error').scrollIntoView({ block: 'nearest' }); };
  const gameName = F('f-game').value.trim();
  if (!gameName) return err('Enter the game’s name.');
  if (!selected.length) return err('Choose at least one player.');
  const coop = F('f-coop').checked;
  const factions = !!editorGame()?.factions;
  const results = [];
  for (const pid of selected) {
    const r = { playerId: pid };
    if (!coop) {
      const raw = (scoreDraft[pid] ?? '').trim();
      r.score = Number(raw);
      if (raw === '' || raw === '-' || !isFinite(r.score)) return err(`Enter a final score for ${playerById(pid).name}.`);
    }
    const faction = (factionDraft[pid] ?? '').trim();
    if (factions && faction) r.faction = faction;
    results.push(r);
  }
  const lowWins = !coop && F('f-low').checked;
  const g = addGame(gameName, { lowWins, coop });
  const previous = db.sessions.find(x => x.id === editing);
  const data = {
    gameId: g.id,
    expansionIds: selectedExp.filter(xid => g.expansions.some(x => x.id === xid)),
    date: F('f-date').value || todayISO(),
    coop, lowWins, results,
    notes: F('f-notes').value.trim(),
    created: previous?.created ?? Date.now()
  };
  if (coop) data.won = coopWon;
  else if (firstPlayer) data.firstPlayerId = firstPlayer;
  write(setDoc(doc(sessionsCol(), editing || newId()), data));
  if (g.lowWins !== lowWins || !!g.coop !== coop) {
    Object.assign(g, { lowWins, coop });
    write(setDoc(doc(gamesCol(), g.id), { lowWins, coop }, { merge: true }));
  }
  const wasEditing = editing;
  dlg.close();
  if (currentView !== 'sessions') show('sessions');
  toast(wasEditing ? 'Session updated' : 'Session saved');
});
F('editor-delete').addEventListener('click', () => {
  if (!editing || !confirm('Delete this session?')) return;
  write(deleteDoc(doc(sessionsCol(), editing)));
  dlg.close(); toast('Session deleted');
});

/* =========================================================
   Game editor
   ========================================================= */
const gameDlg = document.getElementById('game-editor');
let editingGame = null;
let expDraft = [];

function openGameEditor(id) {
  editingGame = id ? gameById(id) : null;
  F('game-title').textContent = editingGame ? 'Edit game' : 'New game';
  F('game-delete').hidden = !editingGame;
  F('game-error').hidden = true;
  F('g-name').value = editingGame?.name || '';
  F('g-low').checked = !!editingGame?.lowWins;
  F('g-coop').checked = !!editingGame?.coop;
  F('g-factions').checked = !!editingGame?.factions;
  F('g-min').value = editingGame?.minPlayers ?? '';
  F('g-max').value = editingGame?.maxPlayers ?? '';
  F('g-time').value = editingGame?.playTime ?? '';
  F('g-low-wrap').hidden = F('g-coop').checked;
  F('g-newexp').value = '';
  expDraft = editingGame ? editingGame.expansions.map(x => ({ ...x })) : [];
  drawExpRows();
  gameDlg.showModal();
  if (!editingGame) setTimeout(() => F('g-name').focus(), 50);
}
function drawExpRows() {
  F('g-exps').innerHTML = expDraft.length
    ? expDraft.map(x => {
        const n = db.sessions.filter(s => s.expansionIds.includes(x.id)).length;
        return `<div class="exp-row">
          <input type="text" data-xname="${x.id}" value="${esc(x.name)}" aria-label="Expansion name">
          <span class="used">${n ? `used ${n}×` : 'unused'}</span>
          <button type="button" class="icon-btn" data-xremove="${x.id}" aria-label="Remove ${esc(x.name)}">${trashSVG}</button>
        </div>`;
      }).join('')
    : '<span class="muted">No expansions yet.</span>';
}
function gameError(msg) {
  F('game-error').textContent = msg;
  F('game-error').hidden = false;
  F('game-error').scrollIntoView({ block: 'nearest' });
}
function addExpansionToDraft() {
  const name = F('g-newexp').value.trim();
  if (!name) return;
  if (!expDraft.some(x => x.name.trim().toLowerCase() === name.toLowerCase())) expDraft.push({ id: newId(), name });
  F('g-newexp').value = '';
  drawExpRows();
}
F('g-exps').addEventListener('input', e => {
  const x = expDraft.find(x => x.id === e.target.dataset.xname);
  if (x) x.name = e.target.value;
});
F('g-exps').addEventListener('click', e => {
  const b = e.target.closest('[data-xremove]');
  if (!b) return;
  expDraft = expDraft.filter(x => x.id !== b.dataset.xremove);
  drawExpRows();
});
F('g-addexp').addEventListener('click', addExpansionToDraft);
F('g-newexp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addExpansionToDraft(); } });
F('g-coop').addEventListener('change', () => { F('g-low-wrap').hidden = F('g-coop').checked; });
F('game-cancel').addEventListener('click', () => gameDlg.close());
gameDlg.addEventListener('close', () => render());

F('game-form').addEventListener('submit', e => {
  e.preventDefault();
  const name = F('g-name').value.trim();
  if (!name) return gameError('Enter the game’s name.');
  const other = gameByName(name);
  if (other && other !== editingGame) return gameError(`${other.name} already exists.`);
  const int = id => F(id).value.trim() === '' ? null : Number(F(id).value);
  let minPlayers = int('g-min'), maxPlayers = int('g-max');
  const playTime = int('g-time');
  if ([minPlayers, maxPlayers, playTime].some(v => v !== null && !(Number.isInteger(v) && v > 0))) return gameError('Player counts and minutes must be whole numbers.');
  minPlayers ??= maxPlayers;
  maxPlayers ??= minPlayers;
  if (minPlayers > maxPlayers) return gameError('Min players can’t be more than max players.');
  const expansions = expDraft.map(x => ({ id: x.id, name: x.name.trim() })).filter(x => x.name);
  const names = expansions.map(x => x.name.toLowerCase());
  const dup = expansions.find((x, i) => names.indexOf(x.name.toLowerCase()) !== i);
  if (dup) return gameError(`There are two expansions called ${dup.name}.`);
  const kept = new Set(expansions.map(x => x.id));
  const affected = editingGame ? sessionsOfGame(editingGame.id).filter(s => s.expansionIds.some(x => !kept.has(x))) : [];
  if (affected.length && !confirm(`Removed expansions will be taken off ${affected.length} session${affected.length > 1 ? 's' : ''}. Their scores stay.`)) return;
  const id = editingGame?.id || newId();
  const coop = F('g-coop').checked;
  const data = { name, coop, lowWins: !coop && F('g-low').checked, factions: F('g-factions').checked, minPlayers, maxPlayers, playTime, expansions };
  const ops = [b => b.set(doc(gamesCol(), id), data)];
  affected.forEach(s => {
    const expansionIds = s.expansionIds.filter(x => kept.has(x));
    ops.push(b => b.set(doc(sessionsCol(), s.id), { expansionIds }, { merge: true }));
  });
  runBatched(ops);
  gameDlg.close();
  toast(editingGame ? 'Game updated' : 'Game added');
});
F('game-delete').addEventListener('click', () => {
  const n = sessionsOfGame(editingGame.id).length;
  if (n) return gameError(`${editingGame.name} is used in ${n} session${n > 1 ? 's' : ''}. Delete those sessions first.`);
  if (!confirm(`Delete ${editingGame.name}?`)) return;
  write(deleteDoc(doc(gamesCol(), editingGame.id)));
  gameDlg.close();
  toast('Game deleted');
});

/* =========================================================
   Utilities and startup
   ========================================================= */
let toastTimer;
function toast(msg) {
  const t = F('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
